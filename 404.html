        /* ==========================================================================
       Stackly — 404 Page
       HTML + CSS + Vanilla JS + GSAP
       ========================================================================== */

        :root {
            --primary: #6da235;
            --primary-light: #8bc34a;
            --primary-dark: #558327;
            --primary-soft: #eef7e7;

            --background: #ffffff;
            --surface: #f8faf6;
            --surface-green: #f3f8ee;

            --text-main: #171b14;
            --text-muted: #5e6659;
            --text-light: #899384;

            --border: #e3ebdd;

            --shadow-soft: 0 12px 30px rgba(23, 27, 20, 0.06);
            --shadow-large: 0 30px 70px rgba(23, 27, 20, 0.10);

            --radius-lg: 28px;
            --radius-xl: 42px;
            --pill: 999px;

            --font:
                'Plus Jakarta Sans',
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                sans-serif;
        }

        /* ==========================================================================
       RESET
       ========================================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-family: var(--font);
            background: var(--background);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 78% 28%,
                    rgba(139, 195, 74, 0.08),
                    transparent 30%),
                #ffffff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* ==========================================================================
       PAGE
       ========================================================================== */

        .error-page {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ==========================================================================
       BACKGROUND DECORATION
       ========================================================================== */

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(1px);
        }

        .ambient-orb.orb-one {
            width: 420px;
            height: 420px;
            top: -220px;
            right: -150px;
            background: rgba(109, 162, 53, 0.07);
        }

        .ambient-orb.orb-two {
            width: 300px;
            height: 300px;
            bottom: -160px;
            left: -120px;
            background: rgba(139, 195, 74, 0.06);
        }

        .dot-pattern {
            position: absolute;
            width: 180px;
            height: 180px;
            right: 7%;
            bottom: 13%;
            background-image:
                radial-gradient(rgba(109, 162, 53, 0.22) 1.3px,
                    transparent 1.3px);
            background-size: 14px 14px;
            mask-image: linear-gradient(135deg,
                    transparent,
                    black 25%,
                    black 75%,
                    transparent);
            -webkit-mask-image: linear-gradient(135deg,
                    transparent,
                    black 25%,
                    black 75%,
                    transparent);
            opacity: 0.65;
            pointer-events: none;
        }

        /* ==========================================================================
       HEADER
       ========================================================================== */

        .error-header {
            position: relative;
            z-index: 20;
            width: 100%;
            padding: 24px 0;
        }

        .header-container {
            width: min(1240px, calc(100% - 48px));
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-logo {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            font-size: 1.38rem;
            font-weight: 800;
            letter-spacing: -0.035em;

            color: var(--text-main);
        }

        .global-logo-img,
        .site-logo img {
            height: 35px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
            filter: brightness(0) saturate(100%) invert(32%) sepia(48%) saturate(612%) hue-rotate(52deg) brightness(92%) contrast(92%);
            transition: filter 0.3s ease;
        }

        .site-logo:hover .global-logo-img,
        .site-logo:hover img {
            filter: brightness(0) saturate(100%) invert(25%) sepia(35%) saturate(800%) hue-rotate(50deg) brightness(85%) contrast(95%);
        }

        .brand-part {
            color: var(--primary);
            font-weight: 700;
        }

        .header-link {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }

        .header-link:hover {
            color: var(--primary);
            transform: translateX(3px);
        }

        .header-link svg {
            width: 15px;
            height: 15px;
        }

        /* ==========================================================================
       MAIN
       ========================================================================== */

        .error-main {
            position: relative;
            z-index: 5;
            flex: 1;

            width: min(1240px, calc(100% - 48px));
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 55px 0 90px;
        }

        .error-layout {
            width: 100%;

            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(400px, 0.85fr);
            align-items: center;

            gap: 90px;
        }

        /* ==========================================================================
       LEFT CONTENT
       ========================================================================== */

        .error-content {
            max-width: 640px;
        }

        .error-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 7px 15px;

            border: 1px solid #d5e7c5;
            border-radius: var(--pill);

            background: var(--primary-soft);
            color: var(--primary);

            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.01em;

            margin-bottom: 26px;
        }

        .error-label-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
        }

        .error-number {
            font-size: clamp(7rem, 15vw, 13rem);
            line-height: 0.78;
            font-weight: 800;
            letter-spacing: -0.09em;

            color: var(--text-main);

            position: relative;
            width: max-content;

            margin-bottom: 35px;
        }

        .error-number span {
            color: var(--primary);
        }

        .error-number::after {
            content: '';
            position: absolute;

            width: 15px;
            height: 15px;

            border-radius: 50%;

            background: var(--primary-light);

            top: 18%;
            right: -25px;

            box-shadow:
                0 0 0 8px rgba(139, 195, 74, 0.10),
                0 0 0 16px rgba(139, 195, 74, 0.05);
        }

        .error-title {
            font-size: clamp(2rem, 4vw, 3.6rem);
            line-height: 1.08;
            letter-spacing: -0.055em;
            font-weight: 800;

            max-width: 560px;

            margin-bottom: 20px;
        }

        .error-description {
            max-width: 510px;

            color: var(--text-muted);

            font-size: 1.03rem;
            line-height: 1.75;

            margin-bottom: 34px;
        }

        /* ==========================================================================
       ACTIONS
       ========================================================================== */

        .error-actions {
            display: flex;
            align-items: center;
            gap: 13px;
            flex-wrap: wrap;
        }

        .error-btn {
            min-height: 50px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 11px;

            padding: 10px 21px;

            border-radius: var(--pill);

            font-size: 0.88rem;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background-color 0.3s ease,
                border-color 0.3s ease;
        }

        .error-btn-primary {
            color: #ffffff;
            background: var(--primary);

            box-shadow:
                0 10px 25px rgba(109, 162, 53, 0.22);
        }

        .error-btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(109, 162, 53, 0.28);
        }

        .error-btn-secondary {
            color: var(--text-main);
            background: #ffffff;

            border: 1px solid var(--border);

            box-shadow: var(--shadow-soft);
        }

        .error-btn-secondary:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--surface-green);

            transform: translateY(-3px);
        }

        .error-btn svg {
            width: 17px;
            height: 17px;
            transition: transform 0.3s ease;
        }

        .error-btn-primary:hover svg {
            transform: translateX(3px);
        }

        /* ==========================================================================
       RIGHT VISUAL
       ========================================================================== */

        .error-visual {
            position: relative;

            min-height: 500px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visual-frame {
            position: relative;

            width: min(100%, 430px);
            aspect-ratio: 0.88;

            border-radius: 42px;

            background:
                radial-gradient(circle at 50% 30%,
                    #edf7e7 0%,
                    #dcefd3 58%,
                    #d3e9c8 100%);

            overflow: hidden;

            box-shadow:
                0 30px 70px rgba(72, 101, 49, 0.12);

            isolation: isolate;
        }

        .visual-frame::before {
            content: '';

            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(rgba(109, 162, 53, 0.28) 1.3px,
                    transparent 1.3px);

            background-size: 15px 15px;

            opacity: 0.35;

            z-index: -1;
        }

        .visual-ring {
            position: absolute;

            width: 280px;
            height: 280px;

            border: 1px solid rgba(109, 162, 53, 0.20);
            border-radius: 50%;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }

        .visual-ring::before {
            content: '';

            position: absolute;
            inset: 28px;

            border: 1px dashed rgba(109, 162, 53, 0.18);
            border-radius: 50%;
        }

        .medical-symbol {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 155px;
            height: 155px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.70);

            border: 1px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                0 20px 50px rgba(65, 88, 48, 0.10);

            display: flex;
            align-items: center;
            justify-content: center;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .medical-symbol svg {
            width: 66px;
            height: 66px;

            color: var(--primary);
        }

        /* ==========================================================================
       FLOATING INFORMATION ELEMENTS
       ========================================================================== */

        .floating-card {
            position: absolute;

            display: flex;
            align-items: center;
            gap: 11px;

            background: rgba(255, 255, 255, 0.93);

            border: 1px solid rgba(255, 255, 255, 0.95);

            border-radius: 16px;

            padding: 11px 15px;

            box-shadow:
                0 15px 35px rgba(45, 60, 30, 0.10);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            z-index: 5;
        }

        .floating-card.card-top {
            top: 13%;
            left: -35px;
        }

        .floating-card.card-bottom {
            right: -35px;
            bottom: 13%;
        }

        .floating-icon {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: var(--primary-soft);
            color: var(--primary);
        }

        .floating-icon svg {
            width: 17px;
            height: 17px;
        }

        .floating-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .floating-title {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .floating-subtitle {
            font-size: 0.66rem;
            color: var(--text-light);
            font-weight: 500;
        }

        /* ==========================================================================
       FOOTER
       ========================================================================== */

        .error-footer {
            position: relative;
            z-index: 5;

            width: min(1240px, calc(100% - 48px));

            margin: 0 auto;

            padding: 20px 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-top: 1px solid rgba(229, 236, 224, 0.8);

            color: var(--text-light);
            font-size: 0.72rem;
            font-weight: 500;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-links a {
            transition: color 0.25s ease;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        /* ==========================================================================
       RESPONSIVE
       ========================================================================== */

        @media (max-width: 1100px) {
            .error-layout {
                grid-template-columns: minmax(0, 1fr) minmax(340px, 0.8fr);
                gap: 50px;
            }

            .floating-card.card-top {
                left: -15px;
            }

            .floating-card.card-bottom {
                right: -15px;
            }
        }

        @media (max-width: 900px) {
            .error-main {
                padding-top: 35px;
            }

            .error-layout {
                grid-template-columns: 1fr;
                gap: 65px;
            }

            .error-content {
                max-width: 700px;
                text-align: center;
                margin: 0 auto;
            }

            .error-number {
                margin-left: auto;
                margin-right: auto;
            }

            .error-description {
                margin-left: auto;
                margin-right: auto;
            }

            .error-actions {
                justify-content: center;
            }

            .error-visual {
                min-height: 440px;
            }
        }

        @media (max-width: 600px) {

            .header-container,
            .error-main,
            .error-footer {
                width: min(100% - 32px, 1240px);
            }

            .error-header {
                padding: 18px 0;
            }

            .site-logo {
                font-size: 1.15rem;
            }

            .site-logo-image {
                width: 31px;
                height: 31px;
            }

            .header-link {
                font-size: 0.78rem;
            }

            .error-main {
                padding: 35px 0 65px;
            }

            .error-layout {
                gap: 50px;
            }

            .error-label {
                margin-bottom: 22px;
            }

            .error-number {
                font-size: 7rem;
                margin-bottom: 28px;
            }

            .error-number::after {
                width: 10px;
                height: 10px;
                right: -15px;
            }

            .error-title {
                font-size: 2.05rem;
            }

            .error-description {
                font-size: 0.92rem;
                line-height: 1.7;
            }

            .error-actions {
                width: 100%;
                flex-direction: column;
            }

            .error-btn {
                width: 100%;
            }

            .error-visual {
                min-height: 390px;
            }

            .visual-frame {
                width: min(100%, 330px);
                border-radius: 32px;
            }

            .visual-ring {
                width: 230px;
                height: 230px;
            }

            .medical-symbol {
                width: 120px;
                height: 120px;
            }

            .medical-symbol svg {
                width: 52px;
                height: 52px;
            }

            .floating-card {
                padding: 9px 11px;
            }

            .floating-card.card-top {
                left: -4px;
                top: 12%;
            }

            .floating-card.card-bottom {
                right: -4px;
                bottom: 12%;
            }

            .floating-icon {
                width: 29px;
                height: 29px;
            }

            .floating-title {
                font-size: 0.67rem;
            }

            .floating-subtitle {
                font-size: 0.59rem;
            }

            .error-footer {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }

        @media (max-width: 390px) {
            .header-link {
                display: none;
            }

            .error-number {
                font-size: 6rem;
            }

            .error-title {
                font-size: 1.8rem;
            }

            .floating-card.card-top {
                left: -8px;
            }

            .floating-card.card-bottom {
                right: -8px;
            }
        }

        /* ==========================================================================
       REDUCED MOTION
       ========================================================================== */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <!-- ==========================================================================
       GSAP ANIMATION
       ========================================================================== -->

    <script>
        window.addEventListener('DOMContentLoaded', () => {

            const reduceMotion = window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            ).matches;

            if (reduceMotion) {
                return;
            }

            // ================================================================
            // INITIAL STATE
            // ================================================================

            gsap.set([
                '.site-logo',
                '.error-label',
                '.error-number',
                '.error-title',
                '.error-description',
                '.error-actions',
                '.error-visual'
            ], {
                opacity: 0
            });

            gsap.set('.error-number', {
                y: 35,
                scale: 0.92
            });

            gsap.set([
                '.error-label',
                '.error-title',
                '.error-description',
                '.error-actions'
            ], {
                y: 25
            });

            gsap.set('.error-visual', {
                x: 40,
                scale: 0.94
            });

            // ================================================================
            // MAIN ENTRANCE TIMELINE
            // ================================================================

            const entranceTimeline = gsap.timeline({
                defaults: {
                    ease: 'power3.out'
                }
            });

            entranceTimeline
                .to('.site-logo', {
                    opacity: 1,
                    y: 0,
                    duration: 0.65
                })

                .to('.error-label', {
                    opacity: 1,
                    y: 0,
                    duration: 0.55
                }, '-=0.25')

                .to('.error-number', {
                    opacity: 1,
                    y: 0,
                    scale: 1,
                    duration: 0.9,
                    ease: 'expo.out'
                }, '-=0.2')

                .to('.error-title', {
                    opacity: 1,
                    y: 0,
                    duration: 0.7
                }, '-=0.55')

                .to('.error-description', {
                    opacity: 1,
                    y: 0,
                    duration: 0.65
                }, '-=0.45')

                .to('.error-actions', {
                    opacity: 1,
                    y: 0,
                    duration: 0.6
                }, '-=0.4')

                .to('.error-visual', {
                    opacity: 1,
                    x: 0,
                    scale: 1,
                    duration: 1,
                    ease: 'power3.out'
                }, '-=0.8');

            // ================================================================
            // FLOATING VISUAL MOTION
            // ================================================================

            gsap.to('.card-top', {
                y: -8,
                duration: 2.8,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            gsap.to('.card-bottom', {
                y: 9,
                duration: 3.2,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 0.35
            });

            gsap.to('.medical-symbol', {
                y: -7,
                duration: 3.5,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            // ================================================================
            // SUBTLE RING ROTATION
            // ================================================================

            gsap.to('.visual-ring', {
                rotation: 360,
                duration: 35,
                repeat: -1,
                ease: 'none'
            });

            // ================================================================
            // BACKGROUND ORB MOTION
            // ================================================================

            gsap.to('.orb-one', {
                x: -30,
                y: 25,
                scale: 1.08,
                duration: 8,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            gsap.to('.orb-two', {
                x: 25,
                y: -20,
                scale: 1.05,
                duration: 9,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            // ================================================================
            // BUTTON MICRO INTERACTION
            // ================================================================

            const primaryButton = document.querySelector(
                '.error-btn-primary'
            );

            if (primaryButton) {
                primaryButton.addEventListener('mouseenter', () => {
                    gsap.to(primaryButton, {
                        y: -3,
                        duration: 0.25,
                        ease: 'power2.out'
                    });
                });

                primaryButton.addEventListener('mouseleave', () => {
                    gsap.to(primaryButton, {
                        y: 0,
                        duration: 0.35,
                        ease: 'power3.out'
                    });
                });
            }

            // Go back button handler
            const goBackBtn = document.getElementById('goBackBtn');
            if (goBackBtn) {
                goBackBtn.addEventListener('click', () => {
                    if (document.referrer && window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = 'index.html';
                    }
                });
            }

        });
    </script>

</body>

</html>
